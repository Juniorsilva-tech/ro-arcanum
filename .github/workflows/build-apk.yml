name: Build ARCANUM APK

# Compila um APK de debug instalável e o publica numa Release do GitHub,
# para baixar direto no celular. Não exige nenhuma conta externa (Expo/EAS).

on:
  push:
    branches:
      - claude/build-app-apk-nzg5ap
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + engine self-test
        run: |
          npm run typecheck
          npm run test:engine

      - name: Expo prebuild (generate android project)
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Locate and rename APK
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          OUT=arcanum-v0.1.0-build${{ github.run_number }}.apk
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcanum-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: ARCANUM APK · build ${{ github.run_number }}
          body: |
            APK de debug do ARCANUM (fatia vertical · cenário Vaelhorn).

            **Como instalar no Android:**
            1. Baixe o arquivo `.apk` abaixo (em "Assets").
            2. Abra no celular e permita "instalar de fontes desconhecidas".
            3. Abra o ARCANUM.

            O jogo roda offline. Para narração ao vivo por IA, cole sua própria
            chave da API da Anthropic em Configurações.
          files: ${{ steps.apk.outputs.path }}
          make_latest: true

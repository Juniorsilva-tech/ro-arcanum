name: Build ARCANUM APK

# Compila um APK de release instalável (só arm64-v8a) e o publica numa Release
# do GitHub, para baixar direto no celular. Sem conta externa (Expo/EAS).

on:
  push:
    branches:
      - claude/build-app-apk-nzg5ap
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + engine self-test
        run: |
          npm run typecheck
          npm run test:engine

      - name: Expo prebuild (generate android project)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (só arm64-v8a; embeds JS, roda standalone)
        run: |
          cd android
          chmod +x gradlew
          # Compila apenas arm64-v8a (a arquitetura de praticamente todo celular
          # atual). Corta ~75% do trabalho nativo — build mais rápido/leve e APK
          # muito menor — evitando o estouro de recursos do runner.
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon --stacktrace -x lint
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

      - name: Locate and rename APK
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          OUT=arcanum-v0.1.0-build${{ github.run_number }}.apk
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcanum-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: ARCANUM APK · build ${{ github.run_number }}
          body: |
            APK de release do ARCANUM (fatia vertical · cenário Vaelhorn) · arm64-v8a.

            **Como instalar no Android:**
            1. Se você instalou uma versão anterior, DESINSTALE antes.
            2. Baixe o arquivo `.apk` abaixo (em "Assets").
            3. Abra no celular e permita "instalar de fontes desconhecidas".
            4. Abra o ARCANUM.

            Compatível com celulares arm64 (praticamente todos os atuais). Roda
            offline. Para narração ao vivo por IA, cole sua própria chave da API
            da Anthropic em Configurações.
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
